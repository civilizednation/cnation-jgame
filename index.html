<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>cnation-KawaiiSnake</title>
<style>
body {
margin: 0;
overflow: hidden;
background-color: #34495e;
font-family: 'Comic Sans MS', 'Malgun Gothic', sans-serif;
touch-action: none;
}
#cnation-start-screen, #cnation-game-over {
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(255, 240, 245, 0.95);
z-index: 30;
}
#cnation-game-over {
display: none;
background: rgba(0, 0, 0, 0.9);
}
h1 {
color: #ff1493;
font-size: 32px;
margin-bottom: 20px;
text-shadow: 2px 2px #fff;
text-align: center;
}
#cnation-game-over h1 {
color: #ff4500;
text-shadow: 2px 2px #000;
margin-bottom: 10px;
}
.cnation-select {
font-size: 20px;
padding: 10px;
margin-bottom: 20px;
border-radius: 10px;
border: 2px solid #ffb6c1;
width: 220px;
}
.cnation-btn {
background-color: #ffb6c1;
color: white;
border: none;
padding: 12px 30px;
margin: 10px;
font-size: 20px;
font-weight: bold;
border-radius: 30px;
cursor: pointer;
box-shadow: 0 5px 0 #ff69b4;
width: 220px;
}
.cnation-btn:active {
transform: translateY(5px);
box-shadow: none;
}
#cnation-game-ui {
position: absolute;
top: 0;
width: 100%;
text-align: center;
z-index: 10;
display: none;
pointer-events: none;
background: rgba(0,0,0,0.6);
padding-bottom: 5px;
}
.cnation-ui-text {
font-size: 16px;
font-weight: bold;
color: #fff;
margin: 3px 0;
text-shadow: 1px 1px 0px #000;
}
#cnation-question-text {
font-size: 28px;
font-weight: bold;
color: #ffd700;
margin: 5px 0;
text-shadow: 2px 2px 0px #000;
}
#cnation-timer-bar {
width: 90%;
height: 12px;
background: #eee;
border-radius: 6px;
margin: 0 auto;
overflow: hidden;
}
#cnation-timer-fill {
width: 100%;
height: 100%;
background: #00ff00;
transition: width 0.1s linear, background 0.3s;
}
.cnation-word-label {
position: absolute;
color: #fff;
font-weight: bold;
font-size: 16px;
text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
pointer-events: none;
transform: translate(-50%, -50%);
z-index: 5;
display: none;
background: rgba(0,0,0,0.4);
padding: 2px 6px;
border-radius: 5px;
}
#cnation-missed-list {
max-height: 180px;
width: 80%;
overflow-y: auto;
background: rgba(255,255,255,0.1);
padding: 10px;
border-radius: 10px;
color: #fff;
font-size: 16px;
text-align: center;
margin: 15px 0;
border: 1px solid #ffb6c1;
}
</style>
</head>
<body>

<div id="cnation-start-screen">
<h1>영단어 마스터<br>지렁이 게임</h1>
<select id="cnation-level-select" class="cnation-select">
<option value="kindergarten">유치원</option>
<option value="elementary">초등학교</option>
<option value="middle">중학생</option>
<option value="high">고등학생</option>
</select>
<button class="cnation-btn" onclick="cnationStartGame()">게임 시작</button>
</div>

<div id="cnation-game-ui">
<p class="cnation-ui-text">난이도: <span id="cnation-game-level">하</span> | SCORE: <span id="cnation-score-val">0</span></p>
<p id="cnation-question-text">의미</p>
<div id="cnation-timer-bar"><div id="cnation-timer-fill"></div></div>
</div>

<div id="cnation-labels-container">
<div id="cnation-label-0" class="cnation-word-label">word1</div>
<div id="cnation-label-1" class="cnation-word-label">word2</div>
<div id="cnation-label-2" class="cnation-word-label">word3</div>
<div id="cnation-label-3" class="cnation-word-label">word4</div>
</div>

<div id="cnation-game-over">
<h1>GAME OVER!</h1>
<p class="cnation-ui-text">최종 점수: <span id="cnation-final-score">0</span></p>
<p class="cnation-ui-text">맞춘 단어: <span id="cnation-final-correct">0</span>개</p>
<div id="cnation-missed-list"></div>
<button class="cnation-btn" onclick="cnationGoToTitle()">타이틀로</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./word.js"></script>
<script>
let cnationAudioCtx;

function cnationInitAudio() {
if (!cnationAudioCtx) {
cnationAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (cnationAudioCtx.state === 'suspended') {
cnationAudioCtx.resume();
}
const osc = cnationAudioCtx.createOscillator();
const gain = cnationAudioCtx.createGain();
osc.connect(gain);
gain.connect(cnationAudioCtx.destination);
gain.gain.value = 0;
osc.start(cnationAudioCtx.currentTime);
osc.stop(cnationAudioCtx.currentTime + 0.01);
}

function cnationPlaySound(type) {
if (!cnationAudioCtx) return;
if (cnationAudioCtx.state === 'suspended') {
cnationAudioCtx.resume();
}
const osc = cnationAudioCtx.createOscillator();
const gain = cnationAudioCtx.createGain();
osc.connect(gain);
gain.connect(cnationAudioCtx.destination);
const now = cnationAudioCtx.currentTime;

if (type === 'correct') {
osc.type = 'sine';
osc.frequency.setValueAtTime(523.25, now);
osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
osc.start(now);
osc.stop(now + 0.15);
} else if (type === 'wrong') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(180, now);
osc.frequency.linearRampToValueAtTime(90, now + 0.2);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
osc.start(now);
osc.stop(now + 0.2);
} else if (type === 'die') {
osc.type = 'square';
osc.frequency.setValueAtTime(300, now);
osc.frequency.linearRampToValueAtTime(60, now + 0.4);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
osc.start(now);
osc.stop(now + 0.4);
}
}

const cnationScene = new THREE.Scene();
cnationScene.background = new THREE.Color(0x34495e);

const cnationBounds = { x: 11, y: 11 };
const cnationCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

function cnationAdjustCamera() {
let aspect = window.innerWidth / window.innerHeight;
cnationCamera.aspect = aspect;
cnationCamera.updateProjectionMatrix();

let fovRad = (cnationCamera.fov * Math.PI) / 180;
let requiredWidth = cnationBounds.x * 2 + 2;
let finalDistance = (requiredWidth / 2) / (Math.tan(fovRad / 2) * aspect);

let topOffset = -2.5;
cnationCamera.position.set(0, finalDistance, topOffset);
cnationCamera.lookAt(0, 0, topOffset);
}

const cnationRenderer = new THREE.WebGLRenderer({ antialias: true });
cnationRenderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(cnationRenderer.domElement);

const cnationAmbientLight = new THREE.AmbientLight(0xffffff, 0.7);
cnationScene.add(cnationAmbientLight);
const cnationDirLight = new THREE.DirectionalLight(0xffffff, 0.6);
cnationDirLight.position.set(10, 20, 5);
cnationScene.add(cnationDirLight);

const cnationFloorGeo = new THREE.PlaneGeometry(cnationBounds.x * 2 + 2, cnationBounds.y * 2 + 2);
const cnationFloorMat = new THREE.MeshPhongMaterial({ color: 0x34495e });
const cnationFloor = new THREE.Mesh(cnationFloorGeo, cnationFloorMat);
cnationFloor.rotation.x = -Math.PI / 2;
cnationFloor.position.y = -0.5;
cnationScene.add(cnationFloor);

const cnationWallGeoX = new THREE.BoxGeometry(cnationBounds.x * 2 + 2, 0.8, 0.8);
const cnationWallGeoY = new THREE.BoxGeometry(0.8, 0.8, cnationBounds.y * 2 + 2);
const cnationWallMat = new THREE.MeshPhongMaterial({ color: 0x95a5a6 });

const cnationWallTop = new THREE.Mesh(cnationWallGeoX, cnationWallMat);
cnationWallTop.position.set(0, 0, -cnationBounds.y - 0.5);
cnationScene.add(cnationWallTop);
const cnationWallBot = new THREE.Mesh(cnationWallGeoX, cnationWallMat);
cnationWallBot.position.set(0, 0, cnationBounds.y + 0.5);
cnationScene.add(cnationWallBot);
const cnationWallLeft = new THREE.Mesh(cnationWallGeoY, cnationWallMat);
cnationWallLeft.position.set(-cnationBounds.x - 0.5, 0, 0);
cnationScene.add(cnationWallLeft);
const cnationWallRight = new THREE.Mesh(cnationWallGeoY, cnationWallMat);
cnationWallRight.position.set(cnationBounds.x + 0.5, 0, 0);
cnationScene.add(cnationWallRight);

let cnationGameState = 'TITLE';
let cnationScore = 0;
let cnationCorrectAnswers = 0;
let cnationGameStage = 0; 
let cnationBaseInterval = 250;
let cnationMaxEnemies = 2;
let cnationMaxTime = 20;

let cnationSelectedVocab = [];
let cnationCurrentQuestion = null;
let cnationTimeLeft = 20;
let cnationLastFrameTime = 0;
let cnationMissedWords = [];

let cnationPlayerLogic = [];
let cnationPlayerMeshes = [];
let cnationPlayerDir = { x: 0, y: -1 };
let cnationPlayerNextDir = { x: 0, y: -1 };
let cnationLastTickTime = 0;

let cnationEnemies = [];
let cnationFoodData = [];

const cnationGeoSphere = new THREE.SphereGeometry(0.5, 32, 32);
const cnationGeoBox = new THREE.BoxGeometry(0.7, 0.7, 0.7);
const cnationMatPlayerHead = new THREE.MeshPhongMaterial({ color: 0xff69b4 });
const cnationMatPlayerBody = new THREE.MeshPhongMaterial({ color: 0xffb6c1 });

const cnationMatEnemyHead = new THREE.MeshPhongMaterial({ color: 0x555555 });
const cnationMatEnemyBody = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });

const cnationMatFood = new THREE.MeshPhongMaterial({ color: 0xffd700 });

window.cnationStartGame = function() {
cnationInitAudio();
let levelKey = document.getElementById('cnation-level-select').value;
cnationSelectedVocab = cnationWordDB[levelKey];
document.getElementById('cnation-start-screen').style.display = 'none';
document.getElementById('cnation-game-over').style.display = 'none';
document.getElementById('cnation-game-ui').style.display = 'block';
cnationAdjustCamera();
cnationResetWorld();
cnationGameState = 'PLAYING';
cnationLastFrameTime = performance.now();
};

window.cnationGoToTitle = function() {
document.getElementById('cnation-game-over').style.display = 'none';
document.getElementById('cnation-game-ui').style.display = 'none';
document.getElementById('cnation-start-screen').style.display = 'flex';
cnationGameState = 'TITLE';
for(let i=0; i<4; i++) {
document.getElementById('cnation-label-'+i).style.display = 'none';
}
};

function cnationUpdateStage() {
if(cnationCorrectAnswers >= 20) {
cnationGameStage = 2; cnationBaseInterval = 120; cnationMaxEnemies = 4; cnationMaxTime = 15;
document.getElementById('cnation-game-level').innerText = "상";
} else if(cnationCorrectAnswers >= 10) {
cnationGameStage = 1; cnationBaseInterval = 180; cnationMaxEnemies = 3; cnationMaxTime = 18;
document.getElementById('cnation-game-level').innerText = "중";
} else {
cnationGameStage = 0; cnationBaseInterval = 250; cnationMaxEnemies = 2; cnationMaxTime = 20;
document.getElementById('cnation-game-level').innerText = "하";
}
while(cnationEnemies.length < cnationMaxEnemies) cnationSpawnEnemy();
}

function cnationResetWorld() {
cnationPlayerMeshes.forEach(m => cnationScene.remove(m));
cnationEnemies.forEach(e => e.meshes.forEach(m => cnationScene.remove(m)));
cnationFoodData.forEach(f => cnationScene.remove(f.mesh));

cnationPlayerLogic = [];
cnationPlayerMeshes = [];
cnationEnemies = [];
cnationFoodData = [];
cnationScore = 0;
cnationCorrectAnswers = 0;
cnationMissedWords = [];
document.getElementById('cnation-score-val').innerText = cnationScore;
cnationPlayerDir = { x: 0, y: -1 };
cnationPlayerNextDir = { x: 0, y: -1 };
cnationLastTickTime = performance.now();

for (let i = 0; i < 3; i++) {
cnationPlayerLogic.push({ x: 0, z: i });
let m = new THREE.Mesh(cnationGeoSphere, i === 0 ? cnationMatPlayerHead : cnationMatPlayerBody);
m.position.set(0, 0.5, i);
cnationPlayerMeshes.push(m);
cnationScene.add(m);
}
cnationUpdateStage();
cnationSpawnQuestion();
}

function cnationSpawnEnemy() {
let rx = Math.floor(Math.random() * (cnationBounds.x * 2 - 4)) - (cnationBounds.x - 2);
let rz = (Math.random() < 0.5) ? cnationBounds.y - 3 : -cnationBounds.y + 3;
let logic = [];
let meshes = [];
for (let i = 0; i < 3; i++) {
logic.push({ x: rx, z: rz + i });
let m = new THREE.Mesh(cnationGeoSphere, i === 0 ? cnationMatEnemyHead : cnationMatEnemyBody);
m.position.set(rx, 0.5, rz + i);
meshes.push(m);
cnationScene.add(m);
}
cnationEnemies.push({ logic: logic, meshes: meshes, dir: { x: 0, y: -1 } });
}

function cnationSpawnQuestion() {
cnationFoodData.forEach(f => cnationScene.remove(f.mesh));
cnationFoodData = [];
cnationTimeLeft = cnationMaxTime;
document.getElementById('cnation-timer-fill').style.background = '#00ff00';

let shuffled = [...cnationSelectedVocab].sort(() => 0.5 - Math.random());
let choices = shuffled.slice(0, 4);
cnationCurrentQuestion = choices[Math.floor(Math.random() * 4)];
document.getElementById('cnation-question-text').innerText = cnationCurrentQuestion.ko;

for(let i=0; i<4; i++) {
let valid = false;
let rx, rz;
let attempts = 0;
while(!valid && attempts < 200) {
rx = Math.floor(Math.random() * (cnationBounds.x * 2 - 4)) - (cnationBounds.x - 2);
rz = Math.floor(Math.random() * (cnationBounds.y * 2 - 4)) - (cnationBounds.y - 2);
valid = true;
for(let p of cnationPlayerLogic) if(p.x === rx && p.z === rz) valid = false;
for(let f of cnationFoodData) {
if(Math.abs(f.x - rx) < 4 && Math.abs(f.z - rz) < 4) valid = false;
}
attempts++;
}
let isCorrect = (choices[i].en === cnationCurrentQuestion.en);
let m = new THREE.Mesh(cnationGeoBox, cnationMatFood);
m.position.set(rx, 0.5, rz);
cnationFoodData.push({ x: rx, z: rz, mesh: m, word: choices[i].en, isCorrect: isCorrect });
cnationScene.add(m);

let lbl = document.getElementById('cnation-label-' + i);
lbl.innerText = choices[i].en;
lbl.style.display = 'block';
}
}

function cnationPenalty() {
cnationPlaySound('wrong');
cnationMissedWords.push(cnationCurrentQuestion);
cnationScore -= 5;
if(cnationScore < 0) cnationScore = 0;
document.getElementById('cnation-score-val').innerText = cnationScore;
if(cnationPlayerLogic.length > 3) {
cnationPlayerLogic.pop();
let m = cnationPlayerMeshes.pop();
cnationScene.remove(m);
}
cnationSpawnQuestion();
}

function cnationUpdateLabels() {
for(let i=0; i<4; i++) {
let f = cnationFoodData[i];
if(!f) continue;
let pos = f.mesh.position.clone();
pos.project(cnationCamera);
let x = (pos.x * 0.5 + 0.5) * window.innerWidth;
let y = (pos.y * -0.5 + 0.5) * window.innerHeight;
let lbl = document.getElementById('cnation-label-' + i);
let offsetX = 0;
let offsetY = -35; 
if(f.z < -cnationBounds.y + 2) offsetY = 35; 
if(f.x < -cnationBounds.x + 2) { offsetX = 40; offsetY = 0; } 
else if(f.x > cnationBounds.x - 2) { offsetX = -40; offsetY = 0; } 
lbl.style.left = (x + offsetX) + 'px';
lbl.style.top = (y + offsetY) + 'px';
}
}

let cnationTouchX = 0; let cnationTouchY = 0;
window.addEventListener('touchstart', (e) => {
cnationTouchX = e.touches[0].screenX; cnationTouchY = e.touches[0].screenY;
});
window.addEventListener('touchend', (e) => {
if (cnationGameState !== 'PLAYING') return;
let dx = e.changedTouches[0].screenX - cnationTouchX;
let dy = e.changedTouches[0].screenY - cnationTouchY;
if (Math.abs(dx) > Math.abs(dy)) {
if (dx > 30 && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: 1, y: 0 };
else if (dx < -30 && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: -1, y: 0 };
} else {
if (dy > 30 && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: 1 };
else if (dy < -30 && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: -1 };
}
});

function cnationGameOver() {
cnationPlaySound('die');
cnationGameState = 'GAMEOVER';
document.getElementById('cnation-final-score').innerText = cnationScore;
document.getElementById('cnation-final-correct').innerText = cnationCorrectAnswers;

let missedHtml = "<b>[오답 및 놓친 단어]</b><br><br>";
if(cnationMissedWords.length === 0) {
missedHtml += "틀린 단어가 없습니다!<br>완벽합니다!";
} else {
cnationMissedWords.forEach(w => {
missedHtml += w.en + " : " + w.ko + "<br>";
});
}
document.getElementById('cnation-missed-list').innerHTML = missedHtml;

document.getElementById('cnation-game-over').style.display = 'flex';
for(let i=0; i<4; i++) document.getElementById('cnation-label-'+i).style.display = 'none';
}

function cnationTick() {
cnationPlayerDir = cnationPlayerNextDir;
let px = cnationPlayerLogic[0].x + cnationPlayerDir.x;
let pz = cnationPlayerLogic[0].z + cnationPlayerDir.y;

cnationEnemies.forEach(e => {
if(Math.random() < 0.15) {
let turns = e.dir.x === 0 ? [{x:1, y:0}, {x:-1, y:0}] : [{x:0, y:1}, {x:0, y:-1}];
e.dir = turns[Math.floor(Math.random() * 2)];
}
let nx = e.logic[0].x + e.dir.x;
let nz = e.logic[0].z + e.dir.y;
let attempts = 0;
while ((nx < -cnationBounds.x || nx > cnationBounds.x || nz < -cnationBounds.y || nz > cnationBounds.y) && attempts < 10) {
let turns = e.dir.x === 0 ? [{x:1, y:0}, {x:-1, y:0}] : [{x:0, y:1}, {x:0, y:-1}];
e.dir = turns[Math.floor(Math.random() * 2)];
nx = e.logic[0].x + e.dir.x;
nz = e.logic[0].z + e.dir.y;
attempts++;
}
if(nx < -cnationBounds.x) { nx = -cnationBounds.x; e.dir = {x:1, y:0}; }
if(nx > cnationBounds.x) { nx = cnationBounds.x; e.dir = {x:-1, y:0}; }
if(nz < -cnationBounds.y) { nz = -cnationBounds.y; e.dir = {x:0, y:1}; }
if(nz > cnationBounds.y) { nz = cnationBounds.y; e.dir = {x:0, y:-1}; }
e.nextX = nx; e.nextZ = nz;
});

if (px < -cnationBounds.x || px > cnationBounds.x || pz < -cnationBounds.y || pz > cnationBounds.y) {
cnationGameOver(); return;
}
for(let i=1; i<cnationPlayerLogic.length; i++) {
if(px === cnationPlayerLogic[i].x && pz === cnationPlayerLogic[i].z) { cnationGameOver(); return; }
}
for(let i=0; i<cnationEnemies.length; i++) {
for(let j=0; j<cnationEnemies[i].logic.length; j++) {
if(px === cnationEnemies[i].logic[j].x && pz === cnationEnemies[i].logic[j].z) { cnationGameOver(); return; }
}
}

let deadEnemies = [];
cnationEnemies.forEach((e, idx) => {
let hit = false;
for(let j=0; j<cnationPlayerLogic.length; j++) {
if(e.nextX === cnationPlayerLogic[j].x && e.nextZ === cnationPlayerLogic[j].z) hit = true;
}
for(let i=0; i<cnationEnemies.length; i++) {
if(i === idx) continue;
for(let j=0; j<cnationEnemies[i].logic.length; j++) {
if(e.nextX === cnationEnemies[i].logic[j].x && e.nextZ === cnationEnemies[i].logic[j].z) hit = true;
}
}
if(hit) deadEnemies.push(idx);
else {
for (let i = e.logic.length - 1; i > 0; i--) { e.logic[i].x = e.logic[i - 1].x; e.logic[i].z = e.logic[i - 1].z; }
e.logic[0].x = e.nextX; e.logic[0].z = e.nextZ;
}
});
for(let i=deadEnemies.length-1; i>=0; i--) {
let eIdx = deadEnemies[i];
cnationEnemies[eIdx].meshes.forEach(m => cnationScene.remove(m));
cnationEnemies.splice(eIdx, 1);
}
while(cnationEnemies.length < cnationMaxEnemies) cnationSpawnEnemy();

let pAteIndex = -1;
for(let f=0; f<cnationFoodData.length; f++) {
if(px === cnationFoodData[f].x && pz === cnationFoodData[f].z) { pAteIndex = f; break; }
}
if(pAteIndex !== -1) {
if(cnationFoodData[pAteIndex].isCorrect) {
cnationPlaySound('correct');
let m = new THREE.Mesh(cnationGeoSphere, cnationMatPlayerBody);
cnationPlayerMeshes.push(m); cnationScene.add(m);
cnationPlayerLogic.push({x: cnationPlayerLogic[cnationPlayerLogic.length-1].x, z: cnationPlayerLogic[cnationPlayerLogic.length-1].z});
cnationScore += 10; cnationCorrectAnswers++;
document.getElementById('cnation-score-val').innerText = cnationScore;
cnationUpdateStage();
cnationSpawnQuestion();
} else {
cnationPenalty();
}
}

if(cnationGameState === 'PLAYING') {
for (let i = cnationPlayerLogic.length - 1; i > 0; i--) {
cnationPlayerLogic[i].x = cnationPlayerLogic[i - 1].x;
cnationPlayerLogic[i].z = cnationPlayerLogic[i - 1].z;
}
cnationPlayerLogic[0].x = px; cnationPlayerLogic[0].z = pz;
}
}

function cnationAnimate(time) {
requestAnimationFrame(cnationAnimate);
let dt = (time - cnationLastFrameTime) / 1000;
cnationLastFrameTime = time;

if (cnationGameState === 'PLAYING') {
cnationTimeLeft -= dt;
let fill = document.getElementById('cnation-timer-fill');
fill.style.width = (cnationTimeLeft / cnationMaxTime * 100) + '%';
if(cnationTimeLeft < 4) fill.style.background = '#ff0000';
if(cnationTimeLeft <= 0) cnationPenalty();

cnationFoodData.forEach(f => {
f.mesh.rotation.x += 0.03; f.mesh.rotation.y += 0.03;
});
if (time - cnationLastTickTime > cnationBaseInterval) {
cnationTick();
cnationLastTickTime = time;
}

let lerpFactor = 0.15;
for (let i = 0; i < cnationPlayerMeshes.length; i++) {
let target = new THREE.Vector3(cnationPlayerLogic[i].x, 0.5, cnationPlayerLogic[i].z);
cnationPlayerMeshes[i].position.lerp(target, lerpFactor);
}
cnationEnemies.forEach(e => {
for(let i=0; i<e.meshes.length; i++) {
let target = new THREE.Vector3(e.logic[i].x, 0.5, e.logic[i].z);
e.meshes[i].position.lerp(target, lerpFactor);
}
});
cnationUpdateLabels();
}
cnationRenderer.render(cnationScene, cnationCamera);
}

window.addEventListener('resize', () => {
cnationAdjustCamera();
cnationRenderer.setSize(window.innerWidth, window.innerHeight);
});

cnationAdjustCamera();
requestAnimationFrame(cnationAnimate);
</script>
</body>
</html>
