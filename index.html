blue: { hHex: 0x154360, bHex: 0x5dade2, hCss: '#154360', bCss: '#5dade2' },

function cnationUpdateWormColors(conf) {
cnationMatPlayerHead.color.setHex(conf.hHex);
cnationMatPlayerBody.color.setHex(conf.bHex);
let hsl = {};
cnationMatPlayerBody.color.getHSL(hsl);
cnationMatPlayerRing.color.setHSL(hsl.h, hsl.s, Math.max(0, hsl.l - 0.2));

document.getElementById('cnation-preview-head').style.backgroundColor = conf.hCss;
document.getElementById('cnation-preview-body1').style.backgroundColor = conf.bCss;
document.getElementById('cnation-preview-body2').style.backgroundColor = conf.bCss;
document.getElementById('cnation-preview-body3').style.backgroundColor = conf.bCss;
}

window.cnationUpdatePreview = function() {
let colorKey = document.getElementById('cnation-color-select').value;
let conf = cnationColorConfig[colorKey];
cnationUpdateWormColors(conf);
};

let cnationAudioCtx;

function cnationInitAudio() {
let soundSetting = document.getElementById('cnation-sound-select').value;
if (soundSetting === 'off') return;
if (!cnationAudioCtx) { cnationAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
if (cnationAudioCtx.state === 'suspended') { cnationAudioCtx.resume(); }
const osc = cnationAudioCtx.createOscillator();
const gain = cnationAudioCtx.createGain();
osc.connect(gain);
gain.connect(cnationAudioCtx.destination);
gain.gain.value = 0;
osc.start(cnationAudioCtx.currentTime);
osc.stop(cnationAudioCtx.currentTime + 0.01);
}

function cnationPlaySound(type) {
let soundSetting = document.getElementById('cnation-sound-select').value;
if (soundSetting === 'off') return;
if (!cnationAudioCtx) return;
if (cnationAudioCtx.state === 'suspended') { cnationAudioCtx.resume(); }
const osc = cnationAudioCtx.createOscillator();
const gain = cnationAudioCtx.createGain();
osc.connect(gain);
gain.connect(cnationAudioCtx.destination);
const now = cnationAudioCtx.currentTime;
let targetVolume = 0.075;

if (type === 'correct') {
osc.type = 'sine';
osc.frequency.setValueAtTime(523.25, now);
osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
gain.gain.setValueAtTime(targetVolume, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
osc.start(now); osc.stop(now + 0.15);
} else if (type === 'wrong') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(180, now);
osc.frequency.linearRampToValueAtTime(90, now + 0.2);
gain.gain.setValueAtTime(targetVolume, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
osc.start(now); osc.stop(now + 0.2);
} else if (type === 'die') {
osc.type = 'square';
osc.frequency.setValueAtTime(300, now);
osc.frequency.linearRampToValueAtTime(60, now + 0.4);
gain.gain.setValueAtTime(targetVolume, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
osc.start(now); osc.stop(now + 0.4);
} else if (type === 'enemy_die') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(150, now);
osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
gain.gain.setValueAtTime(0.05, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
osc.start(now); osc.stop(now + 0.1);
} else if (type === 'heal') {
osc.type = 'sine';
osc.frequency.setValueAtTime(440, now);
osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
gain.gain.setValueAtTime(targetVolume, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
osc.start(now); osc.stop(now + 0.2);
} else if (type === 'freeze') {
osc.type = 'sine';
osc.frequency.setValueAtTime(800, now);
osc.frequency.linearRampToValueAtTime(1200, now + 0.3);
gain.gain.setValueAtTime(targetVolume, now);
gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
osc.start(now); osc.stop(now + 0.3);
} else if (type === 'bonus') {
osc.type = 'square';
osc.frequency.setValueAtTime(400, now);
osc.frequency.setValueAtTime(600, now + 0.1);
osc.frequency.setValueAtTime(800, now + 0.2);
gain.gain.setValueAtTime(targetVolume, now);
gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
osc.start(now); osc.stop(now + 0.3);
}
}

const cnationScene = new THREE.Scene();
cnationScene.background = new THREE.Color(0x34495e);

const cnationBounds = { x: 11, y: 11 };
const cnationCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

function cnationAdjustCamera() {
let aspect = window.innerWidth / window.innerHeight;
cnationCamera.aspect = aspect;
cnationCamera.updateProjectionMatrix();
let fovRad = (cnationCamera.fov * Math.PI) / 180;
let requiredWidth = cnationBounds.x * 2 + 2;
let finalDistance = (requiredWidth / 2) / (Math.tan(fovRad / 2) * aspect);
let topOffset = -2.5;
cnationCamera.position.set(0, finalDistance, topOffset);
cnationCamera.lookAt(0, 0, topOffset);
}

const cnationGeoBox = new THREE.BoxGeometry(0.7, 0.7, 0.7);

const cnationHeartShape = new THREE.Shape();
const hx = 0, hy = 0;
cnationHeartShape.moveTo( hx + 5, hy + 5 );
cnationHeartShape.bezierCurveTo( hx + 5, hy + 5, hx + 4, hy, hx, hy );
cnationHeartShape.bezierCurveTo( hx - 6, hy, hx - 6, hy + 7, hx - 6, hy + 7 );
cnationHeartShape.bezierCurveTo( hx - 6, hy + 11, hx - 3, hy + 15.4, hx + 5, hy + 19 );
cnationHeartShape.bezierCurveTo( hx + 12, hy + 15.4, hx + 16, hy + 11, hx + 16, hy + 7 );
cnationHeartShape.bezierCurveTo( hx + 16, hy + 7, hx + 16, hy, hx + 10, hy );
cnationHeartShape.bezierCurveTo( hx + 7, hy, hx + 5, hy + 5, hx + 5, hy + 5 );
const cnationHeartExtrude = { depth: 2, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 1, bevelThickness: 1, curveSegments: 12 };
const cnationGeoHeart = new THREE.ExtrudeGeometry( cnationHeartShape, cnationHeartExtrude );
cnationGeoHeart.center();
cnationGeoHeart.scale(0.025, -0.025, 0.025);

const cnationGeoIce = new THREE.BoxGeometry(0.5, 0.5, 0.5);

const cnationStarShape = new THREE.Shape();
const outerRadius = 10, innerRadius = 4, numPoints = 5;
for(let i = 0; i < numPoints * 2; i++) {
const r = (i % 2 === 0) ? outerRadius : innerRadius;
const a = i * Math.PI / numPoints;
if(i === 0) cnationStarShape.moveTo(r * Math.sin(a), r * Math.cos(a));
else cnationStarShape.lineTo(r * Math.sin(a), r * Math.cos(a));
}
const cnationStarExtrude = { depth: 2, bevelEnabled: true, bevelThickness: 1, bevelSize: 1, bevelSegments: 1, curveSegments: 12 };
const cnationGeoStar = new THREE.ExtrudeGeometry(cnationStarShape, cnationStarExtrude);
cnationGeoStar.center();
cnationGeoStar.scale(0.03, 0.03, 0.03);


function cnationCreateHeadMesh(isEnemy) {
const group = new THREE.Group();
const head = new THREE.Mesh(cnationGeoBody, isEnemy ? cnationMatEnemyHead : cnationMatPlayerHead);
group.add(head);
const leftEye = new THREE.Mesh(cnationGeoEye, cnationMatWhite);
leftEye.position.set(-0.2, 0.2, 0.35);
const leftPupil = new THREE.Mesh(cnationGeoPupil, cnationMatBlack);
leftPupil.position.set(0, 0, 0.1);
leftEye.add(leftPupil);
group.add(leftEye);
const rightEye = new THREE.Mesh(cnationGeoEye, cnationMatWhite);
rightEye.position.set(0.2, 0.2, 0.35);
const rightPupil = new THREE.Mesh(cnationGeoPupil, cnationMatBlack);
rightPupil.position.set(0, 0, 0.1);
rightEye.add(rightPupil);
group.add(rightEye);
return group;
}

function cnationCreateBodyMesh(isEnemy) {
const group = new THREE.Group();
const body = new THREE.Mesh(cnationGeoBody, isEnemy ? cnationMatEnemyBody : cnationMatPlayerBody);
group.add(body);
const ring = new THREE.Mesh(cnationGeoRing, isEnemy ? cnationMatEnemyRing : cnationMatPlayerRing);
group.add(ring);
return group;
}

async function cnationHandleScore(score, levelKey) {
if (score <= 0) return;
const docRef = doc(db, SCORE_COL, levelKey);
let topScores = [];
try {
const snap = await getDoc(docRef);
if (snap.exists()) {
topScores = snap.data().scores || [];
}
} catch (e) {
console.error("Firebase fetch error", e);
}

let isHighScore = false;
if (topScores.length < 10) {
isHighScore = true;
} else {
const minScore = topScores[topScores.length - 1].score;
if (score > minScore) isHighScore = true;
}

if (isHighScore) {
cnationPendingScore = score;
cnationPendingLevel = levelKey;
cnationPendingScoresList = topScores;
document.getElementById('cnation-prompt-input').value = '';
document.getElementById('cnation-prompt-screen').style.display = 'flex';
}
}

window.cnationSubmitName = async function() {

}
document.getElementById('cnation-prompt-screen').style.display = 'none';

name = name.substring(0, 20);
cnationPendingScoresList.push({ name: name, score: cnationPendingScore });
cnationPendingScoresList.sort((a, b) => b.score - a.score);
cnationPendingScoresList = cnationPendingScoresList.slice(0, 10);

try {
await setDoc(doc(db, SCORE_COL, cnationPendingLevel), { scores: cnationPendingScoresList });
} catch(e) {
console.error("Save error", e);
}
};

function cnationResetWorld() {
cnationPlayerMeshes.forEach(m => cnationScene.remove(m));
cnationEnemies.forEach(e => e.meshes.forEach(m => cnationScene.remove(m)));
cnationFoodData.forEach(f => cnationScene.remove(f.mesh));

if(cnationHeartItem) { cnationScene.remove(cnationHeartItem.mesh); cnationHeartItem = null; }
if(cnationIceItem) { cnationScene.remove(cnationIceItem.mesh); cnationIceItem = null; }
if(cnationStarItem) { cnationScene.remove(cnationStarItem.mesh); cnationStarItem = null; }

cnationMatEnemyHead.transparent = false; cnationMatEnemyHead.opacity = 1.0;
cnationMatEnemyBody.transparent = false; cnationMatEnemyBody.opacity = 1.0;
cnationMatEnemyRing.transparent = false; cnationMatEnemyRing.opacity = 1.0;
cnationEnemiesFrozen = false;

cnationPlayerLogic = [];
cnationPlayerMeshes = [];
cnationEnemies = [];
cnationFoodData = [];
cnationScore = 0;
cnationCorrectAnswers = 0;
cnationMissedWords = [];

cnationLastEnemyTickTime = performance.now();

cnationPlayerLogic.push({ x: 0, z: i });

}

}

function cnationSpawnEnemy() {
let rx = Math.floor(Math.random() * (cnationBounds.x * 2 - 4)) - (cnationBounds.x - 2);
let rz = (Math.random() < 0.5) ? cnationBounds.y - 3 : -cnationBounds.y + 3;
let logic = [];
let meshes = [];
for (let i = 0; i < 3; i++) {
logic.push({ x: rx, z: rz + i });
let m = i === 0 ? cnationCreateHeadMesh(true) : cnationCreateBodyMesh(true);
m.position.set(rx, 0.5, rz + i);
meshes.push(m);
cnationScene.add(m);
}
cnationEnemies.push({ logic: logic, meshes: meshes, dir: { x: 0, y: -1 } });
}

function cnationSpawnQuestion() {
cnationFoodData.forEach(f => cnationScene.remove(f.mesh));
cnationFoodData = [];

if(cnationHeartItem) { cnationScene.remove(cnationHeartItem.mesh); cnationHeartItem = null; }
if(cnationIceItem) { cnationScene.remove(cnationIceItem.mesh); cnationIceItem = null; }
if(cnationStarItem) { cnationScene.remove(cnationStarItem.mesh); cnationStarItem = null; }

cnationMatEnemyHead.transparent = false; cnationMatEnemyHead.opacity = 1.0;
cnationMatEnemyBody.transparent = false; cnationMatEnemyBody.opacity = 1.0;
cnationMatEnemyRing.transparent = false; cnationMatEnemyRing.opacity = 1.0;
cnationEnemiesFrozen = false;

cnationTimeLeft = cnationMaxTime;
document.getElementById('cnation-timer-fill').style.background = '#00ff00';

let shuffled = [...cnationSelectedVocab].sort(() => 0.5 - Math.random());
let choices = shuffled.slice(0, 4);
cnationCurrentQuestion = choices[Math.floor(Math.random() * 4)];
document.getElementById('cnation-question-text').innerText = cnationCurrentQuestion.ko;

for(let i=0; i<4; i++) {
let valid = false;
let rx, rz;
let attempts = 0;
while(!valid && attempts < 200) {
rx = Math.floor(Math.random() * (cnationBounds.x * 2 - 4)) - (cnationBounds.x - 2);
rz = Math.floor(Math.random() * (cnationBounds.y * 2 - 4)) - (cnationBounds.y - 2);
valid = true;
for(let p of cnationPlayerLogic) if(p.x === rx && p.z === rz) valid = false;
for(let f of cnationFoodData) {
if(Math.abs(f.x - rx) < 4 && Math.abs(f.z - rz) < 4) valid = false;
}
attempts++;
}

let isCorrect = (choices[i].en === cnationCurrentQuestion.en);
let m = new THREE.Mesh(cnationGeoBox, cnationMatFood);
m.position.set(rx, 0.5, rz);
cnationFoodData.push({ x: rx, z: rz, mesh: m, word: choices[i].en, isCorrect: isCorrect });
cnationScene.add(m);

let lbl = document.getElementById('cnation-label-' + i);
lbl.innerText = choices[i].en;
lbl.style.display = 'block';
}

function getValidPos() {
let valid = false, rx, rz, attempts = 0;
while(!valid && attempts < 200) {
rx = Math.floor(Math.random() * (cnationBounds.x * 2 - 4)) - (cnationBounds.x - 2);
rz = Math.floor(Math.random() * (cnationBounds.y * 2 - 4)) - (cnationBounds.y - 2);
valid = true;
for(let p of cnationPlayerLogic) if(p.x === rx && p.z === rz) valid = false;
for(let f of cnationFoodData) if(f.x === rx && f.z === rz) valid = false;
if(cnationHeartItem && cnationHeartItem.x === rx && cnationHeartItem.z === rz) valid = false;
if(cnationIceItem && cnationIceItem.x === rx && cnationIceItem.z === rz) valid = false;
if(cnationStarItem && cnationStarItem.x === rx && cnationStarItem.z === rz) valid = false;
attempts++;
}
return valid ? {x: rx, z: rz} : null;
}

if(Math.random() < 0.50) {
let pos = getValidPos();
if(pos) {
let m = new THREE.Mesh(cnationGeoHeart, cnationMatHeart);
m.position.set(pos.x, 0.5, pos.z);
cnationScene.add(m);
cnationHeartItem = { x: pos.x, z: pos.z, mesh: m };
}
}
if(Math.random() < 0.50) {
let pos = getValidPos();
if(pos) {
let m = new THREE.Mesh(cnationGeoIce, cnationMatIce);
m.position.set(pos.x, 0.5, pos.z);
cnationScene.add(m);
cnationIceItem = { x: pos.x, z: pos.z, mesh: m };
}
}
if(Math.random() < 0.50) {
let pos = getValidPos();
if(pos) {
let m = new THREE.Mesh(cnationGeoStar, cnationMatStar);
m.position.set(pos.x, 0.5, pos.z);
cnationScene.add(m);
cnationStarItem = { x: pos.x, z: pos.z, mesh: m };
}
}
}

function cnationPenalty() {
cnationPlaySound('wrong');
let fb = document.getElementById('cnation-feedback-text');
fb.innerHTML = `<span style="color:#8B0000;">틀렸습니다.</span> <span style="color:#008000;">정답은 ${cnationCurrentQuestion.en}(${cnationCurrentQuestion.ko})</span>`;
fb.style.display = 'inline-block';

cnationMissedWords.push(cnationCurrentQuestion);
cnationScore -= 5;
if(cnationScore < 0) cnationScore = 0;
document.getElementById('cnation-score-val').innerText = cnationScore;

cnationLives--;
cnationUpdateLivesUI();

if(cnationPlayerLogic.length > 0) {
cnationPlayerLogic.pop();
let m = cnationPlayerMeshes.pop();
cnationScene.remove(m);
}

if(cnationLives <= 0 || cnationPlayerLogic.length === 0) {
cnationGameOver();
} else {
cnationSpawnQuestion();
}
}

function cnationUpdateLabels() {
let baseFontSize = Math.min(40, Math.max(16, window.innerWidth * 0.04));
for(let i=0; i<4; i++) {
let f = cnationFoodData[i];
if(!f) continue;
let pos = f.mesh.position.clone();
pos.project(cnationCamera);
let x = (pos.x * 0.5 + 0.5) * window.innerWidth;
let y = (pos.y * -0.5 + 0.5) * window.innerHeight;
let lbl = document.getElementById('cnation-label-' + i);
lbl.style.fontSize = baseFontSize + 'px';
let offsetX = 0;
let offsetY = -(baseFontSize * 2); 
if(f.z < -cnationBounds.y + 2) offsetY = (baseFontSize * 2); 
if(f.x < -cnationBounds.x + 2) { offsetX = (baseFontSize * 2.5); offsetY = 0; } 
else if(f.x > cnationBounds.x - 2) { offsetX = -(baseFontSize * 2.5); offsetY = 0; } 
lbl.style.left = (x + offsetX) + 'px';
lbl.style.top = (y + offsetY) + 'px';
}
}

window.addEventListener('keydown', (e) => {
if (cnationGameState !== 'PLAYING') return;
if (e.key === 'ArrowUp' && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: -1 };
else if (e.key === 'ArrowDown' && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: 1 };
else if (e.key === 'ArrowLeft' && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: -1, y: 0 };
else if (e.key === 'ArrowRight' && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: 1, y: 0 };
});

let cnationTouchX = 0; let cnationTouchY = 0;
window.addEventListener('touchstart', (e) => {
cnationTouchX = e.touches[0].screenX; cnationTouchY = e.touches[0].screenY;
});
window.addEventListener('touchend', (e) => {
if (cnationGameState !== 'PLAYING') return;
let dx = e.changedTouches[0].screenX - cnationTouchX;
let dy = e.changedTouches[0].screenY - cnationTouchY;
if (Math.abs(dx) > Math.abs(dy)) {
if (dx > 30 && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: 1, y: 0 };
else if (dx < -30 && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: -1, y: 0 };
} else {
if (dy > 30 && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: 1 };
else if (dy < -30 && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: -1 };
}
});

function cnationGameOver() {
cnationPlaySound('die');
cnationGameState = 'GAMEOVER';
document.getElementById('cnation-final-score').innerText = cnationScore;
document.getElementById('cnation-final-correct').innerText = cnationCorrectAnswers;

let missedHtml = "<b>[오답 및 놓친 단어]</b><br><br>";
if(cnationMissedWords.length === 0) {
missedHtml += "틀린 단어가 없습니다!<br>완벽합니다!";
} else {
cnationMissedWords.forEach(w => {
missedHtml += w.en + " : " + w.ko + "<br>";
});
}
document.getElementById('cnation-missed-list').innerHTML = missedHtml;

document.getElementById('cnation-game-over').style.display = 'flex';
for(let i=0; i<4; i++) document.getElementById('cnation-label-'+i).style.display = 'none';

let levelKey = document.getElementById('cnation-level-select').value;
setTimeout(() => {
cnationHandleScore(cnationScore, levelKey);
}, 500);
}

function cnationPlayerTick() {
cnationPlayerDir = cnationPlayerNextDir;
let px = cnationPlayerLogic[0].x + cnationPlayerDir.x;
let pz = cnationPlayerLogic[0].z + cnationPlayerDir.y;

if (px < -cnationBounds.x || px > cnationBounds.x || pz < -cnationBounds.y || pz > cnationBounds.y) {
cnationGameOver(); return;
}
for(let i=1; i<cnationPlayerLogic.length; i++) {
if(px === cnationPlayerLogic[i].x && pz === cnationPlayerLogic[i].z) { cnationGameOver(); return; }
}

if (!cnationEnemiesFrozen) {
for(let i=0; i<cnationEnemies.length; i++) {
for(let j=0; j<cnationEnemies[i].logic.length; j++) {
if(px === cnationEnemies[i].logic[j].x && pz === cnationEnemies[i].logic[j].z) { cnationGameOver(); return; }
}
}
}

if(cnationHeartItem && px === cnationHeartItem.x && pz === cnationHeartItem.z) {
cnationPlaySound('heal');
cnationScene.remove(cnationHeartItem.mesh);
cnationHeartItem = null;
if(cnationLives < cnationMaxLives) {
cnationLives++;
cnationUpdateLivesUI();
cnationShowEventMsg('체력 1 회복 💖', 'rgba(255, 105, 180, 0.95)');
}
}

if(cnationIceItem && px === cnationIceItem.x && pz === cnationIceItem.z) {
cnationPlaySound('freeze');
cnationScene.remove(cnationIceItem.mesh);
cnationIceItem = null;
cnationEnemiesFrozen = true;
cnationMatEnemyHead.transparent = true; cnationMatEnemyHead.opacity = 0.3;
cnationMatEnemyBody.transparent = true; cnationMatEnemyBody.opacity = 0.3;
cnationMatEnemyRing.transparent = true; cnationMatEnemyRing.opacity = 0.3;
}

if(cnationStarItem && px === cnationStarItem.x && pz === cnationStarItem.z) {
cnationPlaySound('bonus');
cnationScene.remove(cnationStarItem.mesh);
cnationStarItem = null;
cnationScore += 30;
document.getElementById('cnation-score-val').innerText = cnationScore;
cnationShowEventMsg('보너스 점수 30점 획득 ⭐', 'rgba(241, 196, 15, 0.95)');
}

let pAteIndex = -1;
for(let f=0; f<cnationFoodData.length; f++) {
if(px === cnationFoodData[f].x && pz === cnationFoodData[f].z) { pAteIndex = f; break; }
}

let willGrow = false;
if(pAteIndex !== -1) {
if(cnationFoodData[pAteIndex].isCorrect) {
cnationPlaySound('correct');
let fb = document.getElementById('cnation-feedback-text');
fb.innerHTML = `<span style="color:#000000;">${cnationCurrentQuestion.en} (${cnationCurrentQuestion.ko}) 정답 입니다.</span>`;
fb.style.display = 'inline-block';

willGrow = true;
cnationScore += 10; cnationCorrectAnswers++;
document.getElementById('cnation-score-val').innerText = cnationScore;
cnationUpdateStage();
cnationSpawnQuestion();
} else {
cnationPenalty();
if(cnationGameState === 'GAMEOVER') return;
}
}

if(cnationGameState === 'PLAYING') {
if(willGrow) {
let m = cnationCreateBodyMesh(false);
cnationPlayerMeshes.push(m); cnationScene.add(m);
cnationPlayerLogic.push({x: cnationPlayerLogic[cnationPlayerLogic.length-1].x, z: cnationPlayerLogic[cnationPlayerLogic.length-1].z});
}

for (let i = cnationPlayerLogic.length - 1; i > 0; i--) {
cnationPlayerLogic[i].x = cnationPlayerLogic[i - 1].x;
cnationPlayerLogic[i].z = cnationPlayerLogic[i - 1].z;
}
cnationPlayerLogic[0].x = px; cnationPlayerLogic[0].z = pz;
}
}

function cnationEnemyTick() {
if(cnationEnemiesFrozen) return;

let deadEnemies = [];
let playedDeathSound = false;

cnationEnemies.forEach((e, idx) => {
if(Math.random() < 0.15) {
let turns = e.dir.x === 0 ? [{x:1, y:0}, {x:-1, y:0}] : [{x:0, y:1}, {x:0, y:-1}];
e.dir = turns[Math.floor(Math.random() * 2)];
}
let nx = e.logic[0].x + e.dir.x;
let nz = e.logic[0].z + e.dir.y;
let attempts = 0;
while ((nx < -cnationBounds.x || nx > cnationBounds.x || nz < -cnationBounds.y || nz > cnationBounds.y) && attempts < 10) {
let turns = e.dir.x === 0 ? [{x:1, y:0}, {x:-1, y:0}] : [{x:0, y:1}, {x:0, y:-1}];
e.dir = turns[Math.floor(Math.random() * 2)];
nx = e.logic[0].x + e.dir.x;
nz = e.logic[0].z + e.dir.y;
attempts++;
}
if(nx < -cnationBounds.x) { nx = -cnationBounds.x; e.dir = {x:1, y:0}; }
if(nx > cnationBounds.x) { nx = cnationBounds.x; e.dir = {x:-1, y:0}; }
if(nz < -cnationBounds.y) { nz = -cnationBounds.y; e.dir = {x:0, y:1}; }
if(nz > cnationBounds.y) { nz = cnationBounds.y; e.dir = {x:0, y:-1}; }
e.nextX = nx; e.nextZ = nz;
});

cnationEnemies.forEach((e, idx) => {
let hit = false;
for(let j=0; j<cnationPlayerLogic.length; j++) {
if(e.nextX === cnationPlayerLogic[j].x && e.nextZ === cnationPlayerLogic[j].z) hit = true;
}
for(let i=0; i<cnationEnemies.length; i++) {
if(i === idx) continue;
for(let j=0; j<cnationEnemies[i].logic.length; j++) {
if(e.nextX === cnationEnemies[i].logic[j].x && e.nextZ === cnationEnemies[i].logic[j].z) hit = true;
}
}
if(hit) {
deadEnemies.push(idx);
if(!playedDeathSound) { cnationPlaySound('enemy_die'); playedDeathSound = true; }
} else {
for (let i = e.logic.length - 1; i > 0; i--) { e.logic[i].x = e.logic[i - 1].x; e.logic[i].z = e.logic[i - 1].z; }
e.logic[0].x = e.nextX; e.logic[0].z = e.nextZ;
}
});

for(let i=deadEnemies.length-1; i>=0; i--) {
let eIdx = deadEnemies[i];
cnationEnemies[eIdx].meshes.forEach(m => cnationScene.remove(m));
cnationEnemies.splice(eIdx, 1);
}
while(cnationEnemies.length < cnationMaxEnemies) cnationSpawnEnemy();
}

function cnationAnimate(time) {
requestAnimationFrame(cnationAnimate);
let dt = (time - cnationLastFrameTime) / 1000;
cnationLastFrameTime = time;

if (cnationGameState === 'PLAYING') {
cnationTimeLeft -= dt;
let fill = document.getElementById('cnation-timer-fill');
fill.style.width = (cnationTimeLeft / cnationMaxTime * 100) + '%';
if(cnationTimeLeft < 4) fill.style.background = '#ff0000';
if(cnationTimeLeft <= 0) cnationPenalty();

cnationFoodData.forEach(f => { f.mesh.rotation.x += 0.03; f.mesh.rotation.y += 0.03; });

if(cnationHeartItem) { cnationHeartItem.mesh.rotation.y += 0.05; }
if(cnationIceItem) { cnationIceItem.mesh.rotation.x += 0.03; cnationIceItem.mesh.rotation.y += 0.05; }
if(cnationStarItem) { cnationStarItem.mesh.rotation.y += 0.06; cnationStarItem.mesh.rotation.z += 0.02; }

if (time - cnationLastTickTime > cnationBaseInterval) {
cnationPlayerTick();
cnationLastTickTime = time;
}

if (time - cnationLastEnemyTickTime > (cnationBaseInterval / 0.7)) {
cnationEnemyTick();
cnationLastEnemyTickTime = time;
}

let lerpFactor = 0.12;
for (let i = 0; i < cnationPlayerMeshes.length; i++) {
let target = new THREE.Vector3(cnationPlayerLogic[i].x, 0.5, cnationPlayerLogic[i].z);
cnationPlayerMeshes[i].position.lerp(target, lerpFactor);

if (i === 0) {
let angle = Math.atan2(cnationPlayerDir.x, cnationPlayerDir.y);
cnationPlayerMeshes[i].rotation.y = angle;
cnationPlayerMeshes[i].scale.set(1, 1, 1);
} else {
let prevPos = cnationPlayerMeshes[i-1].position;
let curPos = cnationPlayerMeshes[i].position;
if (prevPos.distanceTo(curPos) > 0.001) { cnationPlayerMeshes[i].lookAt(prevPos); }
if (i === cnationPlayerMeshes.length - 1) {
cnationPlayerMeshes[i].scale.lerp(new THREE.Vector3(0.5, 0.5, 0.9), 0.2);
} else {
cnationPlayerMeshes[i].scale.lerp(new THREE.Vector3(1, 1, 1), 0.2);
}
}
}
cnationEnemies.forEach(e => {
for(let i=0; i<e.meshes.length; i++) {
let target = new THREE.Vector3(e.logic[i].x, 0.5, e.logic[i].z);
e.meshes[i].position.lerp(target, lerpFactor);

if (i === 0) {
let angle = Math.atan2(e.dir.x, e.dir.y);
e.meshes[i].rotation.y = angle;
e.meshes[i].scale.set(1, 1, 1);
} else {
let prevPos = e.meshes[i-1].position;
let curPos = e.meshes[i].position;
if (prevPos.distanceTo(curPos) > 0.001) { e.meshes[i].lookAt(prevPos); }
if (i === e.meshes.length - 1) {
e.meshes[i].scale.lerp(new THREE.Vector3(0.5, 0.5, 0.9), 0.2);
} else {
e.meshes[i].scale.lerp(new THREE.Vector3(1, 1, 1), 0.2);
}
}
}
});
cnationUpdateLabels();
}
cnationRenderer.render(cnationScene, cnationCamera);
}

window.addEventListener('resize', () => {
cnationAdjustCamera();
cnationRenderer.setSize(window.innerWidth, window.innerHeight);
});

cnationAdjustCamera();
requestAnimationFrame(cnationAnimate);
</script>
</body>
</html>
