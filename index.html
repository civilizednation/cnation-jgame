<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>cnation-KawaiiSnake</title>
<style>
body {
margin: 0;
overflow: hidden;
background-color: #2c3e50;
font-family: 'Comic Sans MS', sans-serif;
touch-action: none;
}
#cnation-start-screen, #cnation-game-over {
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(255, 240, 245, 0.95);
z-index: 30;
}
#cnation-game-over {
display: none;
background: rgba(0, 0, 0, 0.7);
}
h1 {
color: #ff1493;
font-size: 36px;
margin-bottom: 30px;
text-shadow: 2px 2px #fff;
text-align: center;
}
#cnation-game-over h1 {
color: #ff4500;
text-shadow: 2px 2px #000;
}
.cnation-btn {
background-color: #ffb6c1;
color: white;
border: none;
padding: 15px 40px;
margin: 10px;
font-size: 22px;
font-weight: bold;
border-radius: 30px;
cursor: pointer;
box-shadow: 0 5px 0 #ff69b4;
width: 200px;
}
.cnation-btn:active {
transform: translateY(5px);
box-shadow: none;
}
#cnation-game-ui {
position: absolute;
top: 10px;
width: 100%;
text-align: center;
z-index: 10;
display: none;
pointer-events: none;
}
#cnation-score-text {
font-size: 24px;
font-weight: bold;
color: #fff;
margin: 0;
text-shadow: 2px 2px 0px #000;
}
</style>
</head>
<body>

<div id="cnation-start-screen">
<h1>명국이의<br>지렁이 게임</h1>
<button class="cnation-btn" onclick="cnationStartGame('easy')">시작 (하)</button>
<button class="cnation-btn" onclick="cnationStartGame('normal')">시작 (중)</button>
<button class="cnation-btn" onclick="cnationStartGame('hard')">시작 (상)</button>
</div>

<div id="cnation-game-ui">
<p id="cnation-score-text">SCORE: <span id="cnation-score-val">0</span></p>
</div>

<div id="cnation-game-over">
<h1>GAME OVER!</h1>
<p id="cnation-score-text" style="margin-bottom: 30px;">최종 점수: <span id="cnation-final-score">0</span></p>
<button class="cnation-btn" onclick="cnationGoToTitle()">타이틀로</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cnationScene = new THREE.Scene();
cnationScene.background = new THREE.Color(0x2c3e50);

const cnationBounds = { x: 12, y: 18 };
const cnationCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
cnationCamera.position.set(0, 35, 0);
cnationCamera.lookAt(0, 0, 0);

const cnationRenderer = new THREE.WebGLRenderer({ antialias: true });
cnationRenderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(cnationRenderer.domElement);

const cnationAmbientLight = new THREE.AmbientLight(0xffffff, 0.7);
cnationScene.add(cnationAmbientLight);
const cnationDirLight = new THREE.DirectionalLight(0xffffff, 0.6);
cnationDirLight.position.set(10, 20, 5);
cnationScene.add(cnationDirLight);

const cnationEatSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
const cnationDieSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3');

const cnationFloorGeo = new THREE.PlaneGeometry(cnationBounds.x * 2 + 2, cnationBounds.y * 2 + 2);
const cnationFloorMat = new THREE.MeshPhongMaterial({ color: 0x34495e });
const cnationFloor = new THREE.Mesh(cnationFloorGeo, cnationFloorMat);
cnationFloor.rotation.x = -Math.PI / 2;
cnationFloor.position.y = -0.5;
cnationScene.add(cnationFloor);

const cnationWallGeoX = new THREE.BoxGeometry(cnationBounds.x * 2 + 3, 1, 1);
const cnationWallGeoY = new THREE.BoxGeometry(1, 1, cnationBounds.y * 2 + 3);
const cnationWallMat = new THREE.MeshPhongMaterial({ color: 0x95a5a6 });

const cnationWallTop = new THREE.Mesh(cnationWallGeoX, cnationWallMat);
cnationWallTop.position.set(0, 0, -cnationBounds.y - 1);
cnationScene.add(cnationWallTop);

const cnationWallBot = new THREE.Mesh(cnationWallGeoX, cnationWallMat);
cnationWallBot.position.set(0, 0, cnationBounds.y + 1);
cnationScene.add(cnationWallBot);

const cnationWallLeft = new THREE.Mesh(cnationWallGeoY, cnationWallMat);
cnationWallLeft.position.set(-cnationBounds.x - 1, 0, 0);
cnationScene.add(cnationWallLeft);

const cnationWallRight = new THREE.Mesh(cnationWallGeoY, cnationWallMat);
cnationWallRight.position.set(cnationBounds.x + 1, 0, 0);
cnationScene.add(cnationWallRight);

let cnationGameState = 'TITLE';
let cnationScore = 0;
let cnationBaseInterval = 200;

let cnationPlayerLogic = [];
let cnationPlayerMeshes = [];
let cnationPlayerDir = { x: 0, y: -1 };
let cnationPlayerNextDir = { x: 0, y: -1 };
let cnationPlayerLastTime = 0;

let cnationEnemies = [];
let cnationFoodMeshes = [];

const cnationGeoSphere = new THREE.SphereGeometry(0.5, 32, 32);
const cnationGeoBox = new THREE.BoxGeometry(0.7, 0.7, 0.7);

const cnationMatPlayerHead = new THREE.MeshPhongMaterial({ color: 0xff69b4 });
const cnationMatPlayerBody = new THREE.MeshPhongMaterial({ color: 0xffb6c1 });
const cnationMatEnemyHead = new THREE.MeshPhongMaterial({ color: 0x3498db });
const cnationMatEnemyBody = new THREE.MeshPhongMaterial({ color: 0x87ceeb });
const cnationMatFood = new THREE.MeshPhongMaterial({ color: 0xffd700 });

window.cnationStartGame = function(difficulty) {
document.getElementById('cnation-start-screen').style.display = 'none';
document.getElementById('cnation-game-over').style.display = 'none';
document.getElementById('cnation-game-ui').style.display = 'block';

if(difficulty === 'easy') cnationBaseInterval = 250;
if(difficulty === 'normal') cnationBaseInterval = 150;
if(difficulty === 'hard') cnationBaseInterval = 80;

cnationResetWorld();
cnationGameState = 'PLAYING';
};

window.cnationGoToTitle = function() {
document.getElementById('cnation-game-over').style.display = 'none';
document.getElementById('cnation-game-ui').style.display = 'none';
document.getElementById('cnation-start-screen').style.display = 'flex';
cnationGameState = 'TITLE';
};

function cnationResetWorld() {
cnationPlayerMeshes.forEach(m => cnationScene.remove(m));
cnationEnemies.forEach(e => e.meshes.forEach(m => cnationScene.remove(m)));
cnationFoodMeshes.forEach(m => cnationScene.remove(m));

cnationPlayerLogic = [];
cnationPlayerMeshes = [];
cnationEnemies = [];
cnationFoodMeshes = [];

cnationScore = 0;
document.getElementById('cnation-score-val').innerText = cnationScore;
cnationPlayerDir = { x: 0, y: -1 };
cnationPlayerNextDir = { x: 0, y: -1 };
cnationPlayerLastTime = performance.now();

for (let i = 0; i < 3; i++) {
cnationPlayerLogic.push({ x: 0, z: i });
let m = new THREE.Mesh(cnationGeoSphere, i === 0 ? cnationMatPlayerHead : cnationMatPlayerBody);
m.position.set(0, 0.5, i);
cnationPlayerMeshes.push(m);
cnationScene.add(m);
}

cnationSpawnEnemy(-5, 5);
cnationSpawnEnemy(5, -5);
cnationSpawnFood();
cnationSpawnFood();
}

function cnationSpawnEnemy(startX, startZ) {
let logic = [];
let meshes = [];
for (let i = 0; i < 3; i++) {
logic.push({ x: startX, z: startZ + i });
let m = new THREE.Mesh(cnationGeoSphere, i === 0 ? cnationMatEnemyHead : cnationMatEnemyBody);
m.position.set(startX, 0.5, startZ + i);
meshes.push(m);
cnationScene.add(m);
}
cnationEnemies.push({
logic: logic,
meshes: meshes,
dir: { x: 0, y: -1 },
lastTime: performance.now(),
interval: 300
});
}

function cnationSpawnFood() {
let rx = Math.floor(Math.random() * (cnationBounds.x * 2)) - cnationBounds.x;
let rz = Math.floor(Math.random() * (cnationBounds.y * 2)) - cnationBounds.y;
let m = new THREE.Mesh(cnationGeoBox, cnationMatFood);
m.position.set(rx, 0.5, rz);
cnationFoodMeshes.push(m);
cnationScene.add(m);
}

let cnationTouchX = 0;
let cnationTouchY = 0;
window.addEventListener('touchstart', (e) => {
cnationTouchX = e.touches[0].screenX;
cnationTouchY = e.touches[0].screenY;
});
window.addEventListener('touchend', (e) => {
if (cnationGameState !== 'PLAYING') return;
let dx = e.changedTouches[0].screenX - cnationTouchX;
let dy = e.changedTouches[0].screenY - cnationTouchY;
if (Math.abs(dx) > Math.abs(dy)) {
if (dx > 30 && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: 1, y: 0 };
else if (dx < -30 && cnationPlayerDir.x === 0) cnationPlayerNextDir = { x: -1, y: 0 };
} else {
if (dy > 30 && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: 1 };
else if (dy < -30 && cnationPlayerDir.y === 0) cnationPlayerNextDir = { x: 0, y: -1 };
}
});

function cnationGameOver() {
cnationGameState = 'GAMEOVER';
cnationDieSound.play().catch(()=>{});
document.getElementById('cnation-final-score').innerText = cnationScore;
document.getElementById('cnation-game-over').style.display = 'flex';
}

function cnationUpdateAI(time) {
cnationEnemies.forEach(enemy => {
if (time - enemy.lastTime > enemy.interval) {
let head = enemy.logic[0];
if(Math.random() < 0.2) {
if(enemy.dir.x === 0) enemy.dir = Math.random() < 0.5 ? {x:1, y:0} : {x:-1, y:0};
else enemy.dir = Math.random() < 0.5 ? {x:0, y:1} : {x:0, y:-1};
}
let nx = head.x + enemy.dir.x;
let nz = head.z + enemy.dir.y;
if (nx < -cnationBounds.x || nx > cnationBounds.x || nz < -cnationBounds.y || nz > cnationBounds.y) {
enemy.dir.x *= -1;
enemy.dir.y *= -1;
nx = head.x + enemy.dir.x;
nz = head.z + enemy.dir.y;
}
for (let i = enemy.logic.length - 1; i > 0; i--) {
enemy.logic[i].x = enemy.logic[i - 1].x;
enemy.logic[i].z = enemy.logic[i - 1].z;
}
enemy.logic[0].x = nx;
enemy.logic[0].z = nz;
enemy.lastTime = time;
}
for(let i=0; i<enemy.meshes.length; i++) {
let t = new THREE.Vector3(enemy.logic[i].x, 0.5, enemy.logic[i].z);
enemy.meshes[i].position.lerp(t, 0.4);
}
});
}

function cnationAnimate(time) {
requestAnimationFrame(cnationAnimate);

if (cnationGameState === 'PLAYING') {
cnationFoodMeshes.forEach(f => {
f.rotation.x += 0.05;
f.rotation.y += 0.05;
});

if (time - cnationPlayerLastTime > cnationBaseInterval) {
cnationPlayerDir = cnationPlayerNextDir;
let nx = cnationPlayerLogic[0].x + cnationPlayerDir.x;
let nz = cnationPlayerLogic[0].z + cnationPlayerDir.y;

if (nx < -cnationBounds.x || nx > cnationBounds.x || nz < -cnationBounds.y || nz > cnationBounds.y) {
cnationGameOver(); return;
}
for (let i = 1; i < cnationPlayerLogic.length; i++) {
if (cnationPlayerLogic[i].x === nx && cnationPlayerLogic[i].z === nz) {
cnationGameOver(); return;
}
}
for (let e of cnationEnemies) {
if (e.logic[0].x === nx && e.logic[0].z === nz) {
cnationGameOver(); return;
}
}

let ateFoodIndex = -1;
for (let i = 0; i < cnationFoodMeshes.length; i++) {
if (Math.abs(nx - cnationFoodMeshes[i].position.x) < 0.5 && Math.abs(nz - cnationFoodMeshes[i].position.z) < 0.5) {
ateFoodIndex = i; break;
}
}

if (ateFoodIndex !== -1) {
let m = new THREE.Mesh(cnationGeoSphere, cnationMatPlayerBody);
cnationPlayerMeshes.push(m);
cnationScene.add(m);
cnationPlayerLogic.push({x: cnationPlayerLogic[cnationPlayerLogic.length-1].x, z: cnationPlayerLogic[cnationPlayerLogic.length-1].z});
cnationScore += 10;
document.getElementById('cnation-score-val').innerText = cnationScore;
cnationEatSound.currentTime = 0;
cnationEatSound.play().catch(()=>{});
cnationScene.remove(cnationFoodMeshes[ateFoodIndex]);
cnationFoodMeshes.splice(ateFoodIndex, 1);
cnationSpawnFood();
}

for (let i = cnationPlayerLogic.length - 1; i > 0; i--) {
cnationPlayerLogic[i].x = cnationPlayerLogic[i - 1].x;
cnationPlayerLogic[i].z = cnationPlayerLogic[i - 1].z;
}
cnationPlayerLogic[0].x = nx;
cnationPlayerLogic[0].z = nz;
cnationPlayerLastTime = time;
}

for (let i = 0; i < cnationPlayerMeshes.length; i++) {
let target = new THREE.Vector3(cnationPlayerLogic[i].x, 0.5, cnationPlayerLogic[i].z);
cnationPlayerMeshes[i].position.lerp(target, 0.4);
}

cnationUpdateAI(time);
}

cnationRenderer.render(cnationScene, cnationCamera);
}

window.addEventListener('resize', () => {
cnationCamera.aspect = window.innerWidth / window.innerHeight;
cnationCamera.updateProjectionMatrix();
cnationRenderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(cnationAnimate);
</script>
</body>
</html>
